<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frigo Frutas | Patos - PB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00875A">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { green: '#00875A', darkGreen: '#005c3d', yellow: '#FFC72C', red: '#E31C23' }
            }
          }
        }
      }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-32">

    <!-- Header -->
    <header class="bg-brand-green text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <img src="logo.jpg" alt="Logo" class="h-10 w-auto rounded-lg border border-white/20 object-contain">
                <div>
                    <h1 class="font-extrabold text-sm tracking-wide leading-tight">Frigo Frutas</h1>
                    <span id="loja-status" class="text-[10px] text-yellow-300 font-medium">Verificando horário...</span>
                </div>
            </div>
            <button onclick="abrirCarrinho()" class="relative bg-brand-yellow text-gray-900 px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="contador-carrinho">0</span>
            </button>
        </div>
    </header>

    <!-- Banner Promocional -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="bg-gradient-to-r from-brand-green to-brand-darkGreen text-white p-4 rounded-2xl shadow-sm relative overflow-hidden">
            <span class="bg-brand-yellow text-gray-900 text-[10px] font-extrabold px-2 py-0.5 rounded uppercase tracking-wider">Especial de Frutas</span>
            <h2 class="text-lg font-black mt-1">Frutas Frescas Selecionadas</h2>
            <p class="text-xs text-emerald-100 mt-0.5">Use o cupom <strong class="text-brand-yellow">FRIGO10</strong> no checkout para 10% OFF!</p>
        </div>

        <!-- Botao Repetir Ultimo Pedido -->
        <div id="container-repetir" class="hidden">
            <button onclick="repetirUltimoPedido()" class="w-full bg-emerald-50 border border-emerald-200 text-emerald-800 p-3 rounded-xl font-bold text-xs flex items-center justify-between shadow-sm">
                <span class="flex items-center gap-2"><i class="fa-solid fa-rotate-right text-brand-green"></i> Repetir Último Pedido</span>
                <span class="text-[10px] bg-emerald-200 px-2 py-0.5 rounded-full">Rápido</span>
            </button>
        </div>

        <!-- Barra de Pesquisa -->
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
            <input type="text" id="input-busca" oninput="filtrarProdutos()" placeholder="Buscar fruta desejada..." class="w-full bg-white pl-10 pr-4 py-3 rounded-xl text-xs border border-gray-200 focus:outline-none focus:border-brand-green shadow-sm">
        </div>

        <!-- Grid de Produtos -->
        <div id="grid-produtos" class="grid grid-cols-2 gap-3">
            <!-- Carregado via Supabase -->
            <div class="col-span-2 text-center py-10 text-gray-400 text-xs">A carregar produtos frescos...</div>
        </div>
    </main>

    <!-- Modal do Carrinho -->
    <div id="modal-carrinho" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 bg-gray-50 border-b flex items-center justify-between">
                <h3 class="font-bold text-sm text-gray-900"><i class="fa-solid fa-bag-shopping text-brand-green mr-1"></i> Seu Carrinho</h3>
                <button onclick="fecharCarrinho()" class="text-gray-400 hover:text-gray-600 text-lg px-2">&times;</button>
            </div>
            
            <div id="lista-carrinho" class="p-4 overflow-y-auto flex-1 space-y-3 divide-y divide-gray-100">
                <!-- Itens -->
            </div>

            <div class="p-4 bg-gray-50 border-t space-y-3">
                <!-- Seletor de Bairro -->
                <div>
                    <label class="block text-[11px] font-bold text-gray-700 mb-1">Selecione o Bairro em Patos/PB:</label>
                    <select id="select-bairro" onchange="atualizarTotais()" class="w-full bg-white border border-gray-200 rounded-xl p-2.5 text-xs font-medium text-gray-800 focus:outline-none focus:border-brand-green">
                        <option value="5.00">Centro (R$ 5,00)</option>
                        <option value="7.00">Belo Horizonte (R$ 7,00)</option>
                        <option value="7.00">Brasília (R$ 7,00)</option>
                        <option value="8.00">Mato Grosso (R$ 8,00)</option>
                        <option value="10.00">Outros Bairros / Periferia (R$ 10,00)</option>
                    </select>
                </div>

                <!-- Cupom -->
                <div class="flex gap-2">
                    <input type="text" id="input-cupom" placeholder="Cupom (ex: FRIGO10)" class="flex-1 bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs uppercase font-bold">
                    <button onclick="aplicarCupom()" class="bg-gray-800 text-white px-4 py-2 rounded-xl text-xs font-bold">Aplicar</button>
                </div>

                <!-- Totais -->
                <div class="space-y-1 text-xs text-gray-600 pt-2 border-t">
                    <div class="flex justify-between"><span>Subtotal:</span> <span id="val-subtotal">R$ 0,00</span></div>
                    <div class="flex justify-between"><span>Taxa de Entrega:</span> <span id="val-frete">R$ 5,00</span></div>
                    <div id="linha-desconto" class="flex justify-between text-emerald-600 font-bold hidden"><span>Desconto (FRIGO10):</span> <span id="val-desconto">-R$ 0,00</span></div>
                    <div class="flex justify-between text-sm font-black text-gray-900 pt-1 border-t"><span>Total:</span> <span id="val-total" class="text-brand-green">R$ 0,00</span></div>
                </div>

                <button onclick="enviarPedidoWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-xs shadow-md flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-base"></i> Enviar Pedido via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cfihhckmgqbnkpyfujam.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmaWhoY2ttZ3FibmtweWZ1amFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyOTYyNTQsImV4cCI6MjEwNzg3MjI1NH0.GTCMCrTrfa-1ISEe3eK-bxRz3-8rn_ZRJJqmJzTQDQo';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let produtosGlobais = [];
        let carrinho = [];
        let descontoAplicado = 0;

        // Verificar Horário de Funcionamento (07:00 às 19:00)
        function verificarStatusLoja() {
            const agora = new Date();
            const hora = agora.getHours();
            const statusEl = document.getElementById('loja-status');
            if (hora >= 7 && hora < 19) {
                statusEl.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-emerald-400 mr-1 animate-pulse"></span> Aberto agora • Patos/PB';
            } else {
                statusEl.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-red-400 mr-1"></span> Fechado no momento ( Abre às 07:00 )';
            }
        }

        async function carregarProdutos() {
            const { data, error } = await supabaseClient.from('produtos').select('*').eq('disponivel', true);
            if (!error && data) {
                produtosGlobais = data;
                renderizarProdutos(produtosGlobais);
            }
        }

        function renderizarProdutos(lista) {
            const container = document.getElementById('grid-produtos');
            container.innerHTML = lista.map(p => `
                <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex flex-col justify-between">
                    <div>
                        <div class="relative mb-2">
                            <img src="${p.imagem}" class="w-full h-28 object-cover rounded-xl">
                            ${p.em_oferta ? '<span class="absolute top-1.5 left-1.5 bg-red-600 text-white text-[9px] font-extrabold px-1.5 py-0.5 rounded uppercase">Oferta</span>' : ''}
                        </div>
                        <h4 class="font-bold text-gray-900 text-xs mb-1 line-clamp-1">${p.nome}</h4>
                        <div class="flex items-baseline gap-1.5 mb-2">
                            <span class="text-sm font-black text-emerald-700">R$ ${Number(p.em_oferta ? p.preco_oferta : p.preco).toFixed(2)}</span>
                            ${p.em_oferta ? `<span class="text-[10px] text-gray-400 line-through">R$ ${Number(p.preco).toFixed(2)}</span>` : ''}
                        </div>
                    </div>
                    <button onclick="adicionarCarrinho(${p.id})" class="w-full bg-brand-green text-white font-bold py-2 rounded-xl text-[11px] flex items-center justify-center gap-1 shadow-sm">
                        <i class="fa-solid fa-plus text-[10px]"></i> Adicionar
                    </button>
                </div>
            `).join('');
        }

        function filtrarProdutos() {
            const termo = document.getElementById('input-busca').value.toLowerCase();
            const filtrados = produtosGlobais.filter(p => p.nome.toLowerCase().includes(termo));
            renderizarProdutos(filtrados);
        }

        function adicionarCarrinho(id) {
            const produto = produtosGlobais.find(p => p.id === id);
            const itemExistente = carrinho.find(i => i.id === id);
            const precoFinal = produto.em_oferta ? produto.preco_oferta : produto.preco;

            if (itemExistente) {
                itemExistente.qtd++;
            } else {
                carrinho.push({ id: produto.id, nome: produto.nome, preco: precoFinal, qtd: 1 });
            }
            atualizarContador();
        }

        function atualizarContador() {
            const totalQtd = carrinho.reduce((sum, i) => sum + i.qtd, 0);
            document.getElementById('contador-carrinho').innerText = totalQtd;
        }

        function abrirCarrinho() {
            const lista = document.getElementById('lista-carrinho');
            if (carrinho.length === 0) {
                lista.innerHTML = '<p class="text-center text-gray-400 text-xs py-6">O seu carrinho está vazio.</p>';
            } else {
                lista.innerHTML = carrinho.map((i, index) => `
                    <div class="flex items-center justify-between py-2 text-xs">
                        <div>
                            <p class="font-bold text-gray-900">${i.nome}</p>
                            <p class="text-gray-500 text-[10px]">R$ ${Number(i.preco).toFixed(2)} un</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="mudarQtd(${index}, -1)" class="w-6 h-6 bg-gray-100 rounded-lg font-bold text-gray-600">-</button>
                            <span class="font-bold text-xs">${i.qtd}</span>
                            <button onclick="mudarQtd(${index}, 1)" class="w-6 h-6 bg-gray-100 rounded-lg font-bold text-gray-600">+</button>
                        </div>
                    </div>
                `).join('');
            }
            atualizarTotais();
            document.getElementById('modal-carrinho').classList.remove('hidden');
        }

        function fecharCarrinho() {
            document.getElementById('modal-carrinho').classList.add('hidden');
        }

        function mudarQtd(index, delta) {
            carrinho[index].qtd += delta;
            if (carrinho[index].qtd <= 0) carrinho.splice(index, 1);
            abrirCarrinho();
            atualizarContador();
        }

        function aplicarCupom() {
            const codigo = document.getElementById('input-cupom').value.trim().toUpperCase();
            const subtotal = carrinho.reduce((sum, i) => sum + (i.preco * i.qtd), 0);
            if (codigo === 'FRIGO10') {
                descontoAplicado = subtotal * 0.10;
                document.getElementById('linha-desconto').classList.remove('hidden');
                document.getElementById('val-desconto').innerText = `-R$ ${descontoAplicado.toFixed(2)}`;
                alert('Cupom FRIGO10 aplicado com sucesso (10% OFF)!');
            } else {
                descontoAplicado = 0;
                document.getElementById('linha-desconto').classList.add('hidden');
                alert('Cupom inválido.');
            }
            atualizarTotais();
        }

        function atualizarTotais() {
            const subtotal = carrinho.reduce((sum, i) => sum + (i.preco * i.qtd), 0);
            const frete = parseFloat(document.getElementById('select-bairro').value);
            const total = Math.max(0, subtotal - descontoAplicado) + frete;

            document.getElementById('val-subtotal').innerText = `R$ ${subtotal.toFixed(2)}`;
            document.getElementById('val-frete').innerText = `R$ ${frete.toFixed(2)}`;
            document.getElementById('val-total').innerText = `R$ ${total.toFixed(2)}`;
        }

        function enviarPedidoWhatsApp() {
            if (carrinho.length === 0) return alert('Adicione itens ao carrinho.');
            const bairroSelect = document.getElementById('select-bairro');
            const nomeBairro = bairroSelect.options[bairroSelect.selectedIndex].text;
            const frete = parseFloat(bairroSelect.value);
            const subtotal = carrinho.reduce((sum, i) => sum + (i.preco * i.qtd), 0);
            const total = Math.max(0, subtotal - descontoAplicado) + frete;

            // Guardar ultimo pedido no localStorage
            localStorage.setItem('frigo_ultimo_pedido', JSON.stringify(carrinho));

            let texto = `🛒 *NOVO PEDIDO - FRIGO FRUTAS*\n\n`;
            carrinho.forEach(i => {
                texto += `• ${i.qtd}x ${i.nome} (R$ ${(i.preco * i.qtd).toFixed(2)})\n`;
            });
            texto += `\n📍 *Bairro:* ${nomeBairro}`;
            texto += `\n📦 *Subtotal:* R$ ${subtotal.toFixed(2)}`;
            if (descontoAplicado > 0) texto += `\n🎟️ *Desconto:* -R$ ${descontoAplicado.toFixed(2)}`;
            texto += `\n🛵 *Taxa de Entrega:* R$ ${frete.toFixed(2)}`;
            texto += `\n💰 *TOTAL A PAGAR:* *R$ ${total.toFixed(2)}*\n\nEnviado via App Oficial Patos/PB.`;

            const url = `https://wa.me/5583998765554?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }

        function verificarUltimoPedido() {
            const salvo = localStorage.getItem('frigo_ultimo_pedido');
            if (salvo) {
                document.getElementById('container-repetir').classList.remove('hidden');
            }
        }

        function repetirUltimoPedido() {
            const salvo = localStorage.getItem('frigo_ultimo_pedido');
            if (salvo) {
                carrinho = JSON.parse(salvo);
                atualizarContador();
                abrirCarrinho();
            }
        }

        window.onload = () => {
            verificarStatusLoja();
            carregarProdutos();
            verificarUltimoPedido();
        };
    </script>
</body>
</html>
