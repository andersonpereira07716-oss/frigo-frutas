<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frigo Frutas | Delivery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: { brand: { green: '#00875A', darkGreen: '#005c3d', yellow: '#FFC72C', red: '#E31C23' } }
          }
        }
      }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-32">

    <!-- Header -->
    <header class="bg-brand-green text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <img src="logo.jpg" alt="Logo" class="h-10 w-10 rounded-lg border border-white/20 object-cover bg-white" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1610832958506-aa56368176cf?auto=format&fit=crop&w=100&q=80';">
                <div>
                    <h1 class="font-extrabold text-sm tracking-wide leading-tight">Frigo Frutas</h1>
                    <div class="text-[10px] text-yellow-300 font-medium">Aberto agora • Patos/PB</div>
                </div>
            </div>
            <button onclick="abrirCarrinho()" class="bg-brand-yellow text-gray-900 px-3 py-1.5 rounded-xl font-extrabold text-xs flex items-center gap-1.5 shadow-sm active:scale-95 transition">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="contador-carrinho">0</span>
            </button>
        </div>
    </header>

    <!-- Loja -->
    <main id="view-loja" class="max-w-md mx-auto px-4 pt-3 space-y-3">
        <div class="bg-gradient-to-r from-brand-green to-brand-darkGreen text-white p-3.5 rounded-2xl shadow-sm">
            <span class="bg-brand-yellow text-gray-900 text-[10px] font-extrabold px-2 py-0.5 rounded uppercase">Hortifrúti Delivery</span>
            <h2 class="text-base font-black mt-1">Frutas e Verduras Frescas</h2>
            <p class="text-xs text-emerald-100 mt-0.5">Cupom ativo: <strong class="text-brand-yellow">FRIGO10</strong> (10% OFF)</p>
        </div>

        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
            <input type="text" id="input-busca" oninput="filtrarProdutos()" placeholder="Pesquisar fruta..." class="w-full bg-white pl-10 pr-4 py-2.5 rounded-xl text-xs border border-gray-200 focus:outline-none focus:border-brand-green shadow-sm">
        </div>

        <div id="grid-produtos" class="grid grid-cols-2 gap-3 pt-1"></div>

        <footer class="pt-8 pb-4 text-center text-xs text-gray-400">
            <p>© Frigo Frutas In House Delivery • Patos/PB</p>
        </footer>
    </main>

    <!-- Modal Carrinho -->
    <div id="modal-carrinho" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 bg-gray-50 border-b flex items-center justify-between">
                <h3 class="font-bold text-sm text-gray-900"><i class="fa-solid fa-bag-shopping text-brand-green mr-1"></i> Seu Carrinho</h3>
                <button onclick="fecharCarrinho()" class="text-gray-400 text-xl font-bold px-2">&times;</button>
            </div>
            
            <div id="lista-carrinho" class="p-4 overflow-y-auto flex-1 space-y-3 divide-y divide-gray-100"></div>

            <div class="p-4 bg-gray-50 border-t space-y-3 overflow-y-auto max-h-[60vh]">
                <input type="text" id="cliente-nome" placeholder="Seu Nome Completo *" required class="w-full bg-white border border-gray-200 rounded-xl p-2.5 text-xs font-medium">
                <input type="tel" id="cliente-fone" placeholder="WhatsApp / Telefone *" required class="w-full bg-white border border-gray-200 rounded-xl p-2.5 text-xs font-medium">
                
                <div>
                    <label class="block text-[11px] font-bold text-gray-700 mb-1">Bairro para entrega em Patos/PB:</label>
                    <select id="select-bairro" onchange="atualizarTotais()" class="w-full bg-white border border-gray-200 rounded-xl p-2.5 text-xs font-medium">
                        <option value="5.00">Centro (R$ 5,00)</option>
                        <option value="7.00">Belo Horizonte (R$ 7,00)</option>
                        <option value="7.00">Brasília (R$ 7,00)</option>
                        <option value="8.00">Mato Grosso (R$ 8,00)</option>
                        <option value="10.00">Outros Bairros (R$ 10,00)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-gray-700 mb-1">Forma de Pagamento:</label>
                    <select id="select-pagamento" class="w-full bg-white border border-gray-200 rounded-xl p-2.5 text-xs font-medium">
                        <option value="Pix">Pix (QR Code / Copia e Cola)</option>
                        <option value="Cartao">Cartão de Crédito/Débito (Na entrega)</option>
                        <option value="Dinheiro">Dinheiro (Espécie)</option>
                    </select>
                </div>

                <div class="space-y-1 text-xs text-gray-600 pt-2 border-t">
                    <div class="flex justify-between"><span>Subtotal:</span> <span id="val-subtotal">R$ 0,00</span></div>
                    <div class="flex justify-between"><span>Taxa de Entrega:</span> <span id="val-frete">R$ 5,00</span></div>
                    <div class="flex justify-between text-sm font-black text-gray-900 pt-1 border-t"><span>Total:</span> <span id="val-total" class="text-brand-green">R$ 0,00</span></div>
                </div>

                <button onclick="enviarPedidoEPainel()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-xl text-xs shadow-md flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-base"></i> Confirmar Pedido e Enviar
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cfihhckmgqbnkpyfujam.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmaWhoY2ttZ3FibmtweWZ1amFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyOTYyNTQsImV4cCI6MjEwNzg3MjI1NH0.GTCMCrTrfa-1ISEe3eK-bxRz3-8rn_ZRJJqmJzTQDQo';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let produtosGlobais = [
            { id: 1, nome: "Maçã Fuji (Kg)", preco: 6.99, imagem: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&w=400&q=80" },
            { id: 2, nome: "Banana Prata (Kg)", preco: 5.49, imagem: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=400&q=80" },
            { id: 3, nome: "Uva Vitória Sem Semente (500g)", preco: 7.90, imagem: "https://images.unsplash.com/photo-1537640538966-79f369143f8f?auto=format&fit=crop&w=400&q=80" },
            { id: 4, nome: "Laranja Pera (Kg)", preco: 4.29, imagem: "https://images.unsplash.com/photo-1611080626919-7cf5a9dbab5b?auto=format&fit=crop&w=400&q=80" }
        ];

        let carrinho = [];

        function renderizarProdutos(lista) {
            document.getElementById('grid-produtos').innerHTML = lista.map(p => `
                <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex flex-col justify-between">
                    <div>
                        <img src="${p.imagem}" class="w-full h-28 object-cover rounded-xl mb-2">
                        <h4 class="font-bold text-gray-900 text-xs mb-1 line-clamp-1">${p.nome}</h4>
                        <span class="text-sm font-black text-emerald-700">R$ ${Number(p.preco).toFixed(2)}</span>
                    </div>
                    <button onclick="adicionarCarrinho(${p.id})" class="mt-2 w-full bg-brand-green text-white font-bold py-2 rounded-xl text-[11px] shadow-sm">
                        + Adicionar
                    </button>
                </div>
            `).join('');
        }

        function adicionarCarrinho(id) {
            const p = produtosGlobais.find(i => i.id === id);
            const item = carrinho.find(i => i.id === id);
            if (item) item.qtd++; else carrinho.push({ id: p.id, nome: p.nome, preco: p.preco, qtd: 1 });
            document.getElementById('contador-carrinho').innerText = carrinho.reduce((a, b) => a + b.qtd, 0);
        }

        function abrirCarrinho() {
            document.getElementById('lista-carrinho').innerHTML = carrinho.length === 0 ? '<p class="text-center text-gray-400 text-xs py-6">Carrinho vazio.</p>' : carrinho.map((i, idx) => `
                <div class="flex items-center justify-between py-2 text-xs">
                    <div>
                        <p class="font-bold text-gray-900">${i.nome}</p>
                        <p class="text-gray-500 text-[10px]">R$ ${Number(i.preco).toFixed(2)} un</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="mudarQtd(${idx}, -1)" class="w-6 h-6 bg-gray-100 rounded-lg font-bold">-</button>
                        <span class="font-bold text-xs">${i.qtd}</span>
                        <button onclick="mudarQtd(${idx}, 1)" class="w-6 h-6 bg-gray-100 rounded-lg font-bold">+</button>
                    </div>
                </div>
            `).join('');
            atualizarTotais();
            document.getElementById('modal-carrinho').classList.remove('hidden');
        }

        function fecharCarrinho() { document.getElementById('modal-carrinho').classList.add('hidden'); }

        function mudarQtd(idx, delta) {
            carrinho[idx].qtd += delta;
            if (carrinho[idx].qtd <= 0) carrinho.splice(idx, 1);
            abrirCarrinho();
            document.getElementById('contador-carrinho').innerText = carrinho.reduce((a, b) => a + b.qtd, 0);
        }

        function atualizarTotais() {
            const sub = carrinho.reduce((a, b) => a + (b.preco * b.qtd), 0);
            const frete = parseFloat(document.getElementById('select-bairro').value);
            document.getElementById('val-subtotal').innerText = `R$ ${sub.toFixed(2)}`;
            document.getElementById('val-frete').innerText = `R$ ${frete.toFixed(2)}`;
            document.getElementById('val-total').innerText = `R$ ${(sub + frete).toFixed(2)}`;
        }

        async function enviarPedidoEPainel() {
            const nome = document.getElementById('cliente-nome').value.trim();
            const fone = document.getElementById('cliente-fone').value.trim();
            if (!nome || !fone) return alert('Por favor, preencha o seu Nome e WhatsApp!');
            if (carrinho.length === 0) return alert('Carrinho vazio.');

            const bairroSelect = document.getElementById('select-bairro');
            const bairroTexto = bairroSelect.options[bairroSelect.selectedIndex].text;
            const formaPag = document.getElementById('select-pagamento').value;
            const sub = carrinho.reduce((a, b) => a + (b.preco * b.qtd), 0);
            const total = sub + parseFloat(bairroSelect.value);

            const resumoItens = carrinho.map(i => `${i.qtd}x ${i.nome} (R$ ${(i.preco * i.qtd).toFixed(2)})`).join(', ');

            // Salva no Banco de Dados para aparecer no Site
            try {
                await supabaseClient.from('pedidos').insert([{
                    cliente_nome: nome,
                    cliente_fone: fone,
                    bairro: bairroTexto,
                    pagamento: formaPag,
                    itens: resumoItens,
                    total: total,
                    status: 'Pendente'
                }]);
            } catch (e) {
                console.error("Erro ao registrar pedido:", e);
            }

            // Envia para o WhatsApp
            let texto = `🛒 *NOVO PEDIDO - FRIGO FRUTAS*\n\n`;
            texto += `👤 *Cliente:* ${nome}\n📞 *WhatsApp:* ${fone}\n📍 *Bairro:* ${bairroTexto}\n💳 *Pagamento:* ${formaPag}\n\n*Itens:*\n`;
            carrinho.forEach(i => texto += `• ${i.qtd}x ${i.nome}\n`);
            texto += `\n💰 *TOTAL:* *R$ ${total.toFixed(2)}*`;

            window.open(`https://wa.me/5583998765554?text=` + encodeURIComponent(texto), '_blank');
        }

        window.onload = () => renderizarProdutos(produtosGlobais);
    </script>
</body>
</html>
