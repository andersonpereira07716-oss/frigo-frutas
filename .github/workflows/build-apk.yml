name: Build APK Frigo Frutas

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap and generate project
        run: |
          npm install -g @bubblewrap/cli
          yes | bubblewrap init --manifest="https://frigo-frutas.vercel.app/manifest.json" --directory="android-app" || true

      - name: Build APK with Gradle
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrigoFrutas-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
