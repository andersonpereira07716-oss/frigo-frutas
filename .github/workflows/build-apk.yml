name: Build APK Frigo Frutas

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Generate Android APK
        run: |
          npx pwa2apk --url "https://frigo-frutas.vercel.app" --name "Frigo Frutas" --output ./output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrigoFrutas-APK
          path: output/*.apk
