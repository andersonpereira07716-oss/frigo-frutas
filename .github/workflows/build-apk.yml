name: Build APK Frigo Frutas

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Android APK via PWABuilder
        uses: pwa-builder/pwa-action@v1.0.2
        with:
          manifest-url: 'https://frigo-frutas.vercel.app/manifest.json'
          signing-key-file: ''

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrigoFrutas-APK
          path: './*.apk'
