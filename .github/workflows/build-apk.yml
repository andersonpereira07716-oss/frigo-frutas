name: Build APK Frigo Frutas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [twa-manifest.json, .github/workflows/build-apk.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configurar Bubblewrap (JDK e Android SDK)
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json

      - name: Preparar chave
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Gerar projeto Android e compilar APK assinado
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json
          bubblewrap build --skipPwaValidation --manifest=twa-manifest.json

      - name: Guardar APK e AAB
        uses: actions/upload-artifact@v4
        with:
          name: frigo-frutas-apk
          path: |
            app-release-signed.apk
            app-release-bundle.aab
