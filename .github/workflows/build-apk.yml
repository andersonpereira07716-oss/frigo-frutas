name: Build APK Frigo Frutas

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize Bubblewrap TWA Non-Interactive
        run: |
          bubblewrap init --manifest="https://frigo-frutas.vercel.app/manifest.json" --directory="twa-app" --skip-sdk-checks --path-to-jdk="/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.20-1/x64" --path-to-android-sdk=""

      - name: Build Android APK
        run: |
          cd twa-app
          bubblewrap build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrigoFrutas-APK
          path: twa-app/*.apk
